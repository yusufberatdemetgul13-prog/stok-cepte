<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Cepte — Tesisat Stok & Borç Takip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#38bdf8;--green:#34d399;--red:#f87171;--txt:#e2e8f0;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}
header{background:linear-gradient(135deg,#0ea5e9,#6366f1);padding:18px 16px;text-align:center;position:sticky;top:0;z-index:50}
header h1{font-size:1.4rem}header p{font-size:.8rem;opacity:.85}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid #334155;z-index:50}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:14px 4px;font-size:.85rem;cursor:pointer}
nav button.active{color:var(--acc);border-top:2px solid var(--acc)}
main{padding:14px;max-width:720px;margin:0 auto}
.btn{background:var(--acc);color:#082f49;border:none;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;font-size:.9rem}
.btn.green{background:var(--green)}.btn.red{background:var(--red);color:#450a0a}
.btn.ghost{background:#334155;color:var(--txt)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.card img,.noimg{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#0f172a;flex-shrink:0}
.noimg{display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.card .info{flex:1;min-width:0}
.card .info h3{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;background:#334155;color:var(--acc);font-size:.68rem;padding:2px 8px;border-radius:20px;margin:3px 3px 0 0}
.price{font-weight:700;color:var(--green);font-size:.9rem}
.qtybox{display:flex;align-items:center;gap:6px}
.qtybox button{width:30px;height:30px;border-radius:8px;border:none;background:#334155;color:#fff;font-size:1rem;cursor:pointer}
.qtybox span{min-width:36px;text-align:center;font-weight:700}
input,select,textarea{width:100%;background:#0f172a;border:1px solid #334155;color:var(--txt);border-radius:10px;padding:11px;font-size:.9rem;margin-bottom:10px}
label{font-size:.75rem;color:var(--mut);display:block;margin-bottom:4px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;overflow-y:auto;padding:16px}
.modal.open{display:block}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:640px;margin:20px auto}
.modal h2{font-size:1.1rem;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none}
#pdfProgress{font-size:.8rem;color:var(--acc);margin:8px 0;min-height:1.2em}
#pdfPreview{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:340px;overflow-y:auto;margin:10px 0}
.pv{background:#0f172a;border-radius:10px;padding:8px;font-size:.7rem;text-align:center}
.pv img{width:100%;height:80px;object-fit:contain;background:#fff;border-radius:6px;margin-bottom:4px}
.pv b{color:var(--green)}
.jobline{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.jobline select,.jobline input{margin-bottom:0}
.totrow{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0}
.totrow.big{font-weight:800;color:var(--acc);border-top:1px solid #334155;margin-top:6px;padding-top:8px}
.searchbar{position:sticky;top:74px;z-index:40}
</style>
</head>
<body>
<header>
  <h1>🧰 Stok Cepte</h1>
  <p>Sahada malzeme ve borç takibi</p>
</header>

<nav>
  <button id="navStok" class="active" onclick="showTab('stok')">📦 Stok</button>
  <button id="navJob" onclick="showTab('job')">👷 Müşteri / Borç</button>
</nav>

<main>
<!-- ============ STOK ============ -->
<section id="tabStok">
  <div class="row">
    <button class="btn" onclick="openModal('mProduct',resetProductForm())">➕ Malzeme Ekle</button>
    <button class="btn ghost" onclick="openModal('mBulk')">📄 Toplu Ürün Ekle</button>
  </div>
  <input class="searchbar" id="stockSearch" placeholder="🔍 Ürün ara (ad / kod / kategori)..." oninput="renderStock()">
  <div id="stockList"></div>
  <div id="stockSummary" style="text-align:center;color:var(--mut);font-size:.8rem;margin:10px 0"></div>
</section>

<!-- ============ MÜŞTERİ / BORÇ ============ -->
<section id="tabJob" class="hidden">
  <div class="row">
    <button class="btn" onclick="openModal('mJob',resetJobForm())">➕ Tesisat Ekle</button>
  </div>
  <div id="jobList"></div>
</section>
</main>

<!-- MODAL: Malzeme Ekle -->
<div class="modal" id="mProduct"><div class="box">
  <h2>Malzeme Ekle</h2>
  <label>Malzeme Adı</label><input id="pName">
  <div class="grid2">
    <div><label>Kategori</label><input id="pCat" list="catList"><datalist id="catList"></datalist></div>
    <div><label>Birim</label><select id="pUnit"><option value="ad">ad</option><option value="m">m</option><option value="takım">takım</option><option value="kutu">kutu</option></select></div>
  </div>
  <div class="grid2">
    <div><label>Adet</label><input id="pQty" type="number" value="0" min="0"></div>
    <div><label>KDV Oranı (%)</label><input id="pVat" type="number" value="20" min="0"></div>
  </div>
  <div class="grid2">
    <div><label>Fiyat (KDV'siz)</label><input id="pBuy" type="number" step="0.01" value="0" oninput="calcSell()"></div>
    <div><label>Kâr Marjı (%)</label><input id="pMargin" type="number" value="25" oninput="calcSell()"></div>
  </div>
  <label>Satış Fiyatı (KDV Dahil) — otomatik hesaplanır</label>
  <div class="price" id="pSellShow" style="font-size:1.2rem;margin-bottom:10px">0 ₺</div>
  <label>Ürün Görseli (Dosya / Kamera)</label>
  <input type="file" id="pImg" accept="image/*" capture="environment" onchange="imgPreview(this)">
  <img id="pImgPrev" class="hidden" style="max-width:120px;border-radius:10px;margin-bottom:8px">
  <button class="btn ghost hidden" id="pImgDel" onclick="delImg()" style="margin-bottom:8px">Görseli kaldır</button>
  <div class="row" style="margin-top:8px">
    <button class="btn ghost" onclick="closeModal('mProduct')">Vazgeç</button>
    <button class="btn green" onclick="saveProduct()">Kaydet</button>
  </div>
</div></div>

<!-- MODAL: Toplu Ürün Ekle (PDF) -->
<div class="modal" id="mBulk"><div class="box">
  <h2>Toplu Ürün Ekle</h2>
  <p style="font-size:.8rem;color:var(--mut);margin-bottom:10px">
    Tedarikçi PDF'ini yükle → ürünler <b>fotoğraflarıyla birlikte</b> otomatik okunur.
    İstersen kutuya kendi JSON listeni de yapıştırabilirsin.</p>
  <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
  <div class="row">
    <button class="btn" onclick="document.getElementById('pdfInput').click()">📄 PDF'ten Oku (Fotoğraflı)</button>
    <button class="btn ghost" onclick="document.getElementById('bulkTextarea').value=''">Kutuyu Temizle</button>
  </div>
  <div id="pdfProgress"></div>
  <div id="pdfPreview"></div>
  <textarea id="bulkTextarea" rows="8" placeholder='[{"code":"70220","name":"STERILEPIPE PN 25 20x3,4","category":"STERILEPIPE","unit":"m","buyPrice":51.20,"vatRate":20,"sellPrice":61.44,"qty":0,"image":""}]'></textarea>
  <div class="row">
    <button class="btn ghost" onclick="closeModal('mBulk')">Vazgeç</button>
    <button class="btn green" onclick="importBulk()">İçe Aktar</button>
  </div>
</div></div>

<!-- MODAL: Tesisat / Borç Ekle -->
<div class="modal" id="mJob"><div class="box">
  <h2>Tesisat / Borç Ekle</h2>
  <button class="btn ghost" style="width:100%;margin-bottom:12px" onclick="voiceFill()">🎙️ Konuşarak Doldur</button>
  <div id="voiceMsg" style="font-size:.75rem;color:var(--acc);margin-bottom:8px"></div>
  <label>Müşteri Adı</label><input id="jName">
  <div class="grid2">
    <div><label>Telefon</label><input id="jPhone" type="tel"></div>
    <div><label>Tarih</label><input id="jDate" type="date"></div>
  </div>
  <label>Tesisat Adresi / Bina</label><input id="jAddr">
  <label>Kullanılan Malzemeler</label>
  <div id="jobLines"></div>
  <button class="btn ghost" style="width:100%;margin-bottom:12px" onclick="addJobLine()">＋ Satır Ekle</button>
  <div class="grid2">
    <div><label>İşçilik (₺)</label><input id="jLabor" type="number" value="0" oninput="calcJob()"></div>
    <div><label>Ödenen Tutar (₺)</label><input id="jPaid" type="number" value="0" oninput="calcJob()"></div>
  </div>
  <div class="totrow"><span>Malzeme Toplamı</span><span id="jMat">0 ₺</span></div>
  <div class="totrow"><span>Genel Toplam</span><span id="jTotal">0 ₺</span></div>
  <div class="totrow big"><span>Kalan Borç</span><span id="jRemain">0 ₺</span></div>
  <div class="row" style="margin-top:10px">
    <button class="btn ghost" onclick="closeModal('mJob')">Vazgeç</button>
    <button class="btn green" onclick="saveJob()">Onayla, Kaydet ve PDF Oluştur</button>
  </div>
</div></div>

<script>
/* ================= VERİ ================= */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let products = JSON.parse(localStorage.getItem('sc_products')||'[]');
let jobs     = JSON.parse(localStorage.getItem('sc_jobs')||'[]');
const save = ()=>{ try{ localStorage.setItem('sc_products',JSON.stringify(products));
  localStorage.setItem('sc_jobs',JSON.stringify(jobs)); }catch(e){ alert('⚠️ Depolama alanı doldu! Görselleri küçült veya eski ürünleri sil.'); } };
const fmt = n => Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';

/* ================= SEKMELER ================= */
function showTab(t){
  document.getElementById('tabStok').classList.toggle('hidden',t!=='stok');
  document.getElementById('tabJob').classList.toggle('hidden',t!=='job');
  document.getElementById('navStok').classList.toggle('active',t==='stok');
  document.getElementById('navJob').classList.toggle('active',t==='job');
}
function openModal(id,fn){document.getElementById(id).classList.add('open');if(fn)fn();}
function closeModal(id){document.getElementById(id).classList.remove('open');}

/* ================= STOK LİSTESİ ================= */
function renderStock(){
  const q=(document.getElementById('stockSearch').value||'').toLocaleLowerCase('tr');
  const list=products.filter(p=>!q||(p.name+p.category+(p.code||'')).toLocaleLowerCase('tr').includes(q));
  document.getElementById('stockList').innerHTML=list.map((p,i)=>{
    const idx=products.indexOf(p);
    const img=p.image?`<img src="${p.image}">`:`<div class="noimg">📦</div>`;
    return `<div class="card">${img}<div class="info">
      <h3>${p.name}</h3>
      <span class="chip">${p.category||'Genel'}</span>
      ${p.code?`<span class="chip">Kod: ${p.code}</span>`:''}
      <div style="margin-top:4px;font-size:.78rem;color:var(--mut)">Alış: ${fmt(p.buyPrice)} • Satış: <span class="price">${fmt(p.sellPrice)}</span> /${p.unit}</div>
    </div>
    <div style="text-align:center">
      <div class="qtybox">
        <button onclick="chgQty(${idx},-1)">−</button><span>${p.qty}${p.unit}</span><button onclick="chgQty(${idx},1)">＋</button>
      </div>
      <button class="btn ghost" style="padding:4px 10px;font-size:.7rem;margin-top:6px" onclick="editProduct(${idx})">✏️</button>
      <button class="btn red" style="padding:4px 10px;font-size:.7rem;margin-top:4px" onclick="delProduct(${idx})">🗑</button>
    </div></div>`;}).join('')||'<p style="text-align:center;color:var(--mut);margin-top:30px">Henüz ürün yok. "Malzeme Ekle" veya "PDF\'ten Oku" ile başla.</p>';
  const val=list.reduce((s,p)=>s+p.qty*p.buyPrice,0);
  document.getElementById('stockSummary').textContent=`${list.length} ürün • Tahmini stok değeri: ${fmt(val)}`;
  document.getElementById('catList').innerHTML=[...new Set(products.map(p=>p.category).filter(Boolean))].map(c=>`<option value="${c}">`).join('');
}
function chgQty(i,d){const p=products[i];p.qty=Math.max(0,Number((+p.qty+d).toFixed(2)));save();renderStock();}
function delProduct(i){if(confirm('"'+products[i].name+'" silinsin mi?')){products.splice(i,1);save();renderStock();}}

/* ================= MALZEME EKLE ================= */
let editIdx=-1, imgData='';
function resetProductForm(){editIdx=-1;imgData='';['pName','pCat'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pQty').value=0;document.getElementById('pVat').value=20;
  document.getElementById('pBuy').value=0;document.getElementById('pMargin').value=25;
  document.getElementById('pImg').value='';delImg();calcSell();}
function editProduct(i){const p=products[i];editIdx=i;
  document.getElementById('pName').value=p.name;document.getElementById('pCat').value=p.category||'';
  document.getElementById('pUnit').value=p.unit;document.getElementById('pQty').value=p.qty;
  document.getElementById('pVat').value=p.vatRate;document.getElementById('pBuy').value=p.buyPrice;
  imgData=p.image||'';if(imgData){const im=document.getElementById('pImgPrev');im.src=imgData;im.classList.remove('hidden');document.getElementById('pImgDel').classList.remove('hidden');}
  calcSell();openModal('mProduct');}
function calcSell(){const b=+document.getElementById('pBuy').value||0,v=(+document.getElementById('pVat').value||0)/100,m=(+document.getElementById('pMargin').value||0)/100;
  document.getElementById('pSellShow').textContent=fmt(b*(1+m)*(1+v));}
function imgPreview(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');
    const sc=Math.min(400/im.width,400/im.height,1);c.width=im.width*sc;c.height=im.height*sc;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);imgData=c.toDataURL('image/jpeg',.8);
    const pv=document.getElementById('pImgPrev');pv.src=imgData;pv.classList.remove('hidden');
    document.getElementById('pImgDel').classList.remove('hidden');};im.src=e.target.result;};r.readAsDataURL(f);}
function delImg(){imgData='';document.getElementById('pImgPrev').classList.add('hidden');document.getElementById('pImgDel').classList.add('hidden');}
function saveProduct(){
  const name=document.getElementById('pName').value.trim();if(!name)return alert('Ürün adı gir!');
  const buy=+document.getElementById('pBuy').value||0,vat=+document.getElementById('pVat').value||0,mar=+document.getElementById('pMargin').value||0;
  const obj={id:Date.now(),code:'',name,category:document.getElementById('pCat').value.trim()||'Genel',
    unit:document.getElementById('pUnit').value,qty:+document.getElementById('pQty').value||0,
    buyPrice:buy,vatRate:vat,sellPrice:+(buy*(1+mar/100)*(1+vat/100)).toFixed(2),image:imgData};
  if(editIdx>=0){obj.code=products[editIdx].code;obj.image=imgData||products[editIdx].image;products[editIdx]=obj;}
  else products.push(obj);
  save();renderStock();closeModal('mProduct');}

/* ================= PDF OKUMA (METİN + FOTOĞRAF) ================= */
document.getElementById('pdfInput').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const prog=document.getElementById('pdfProgress'),prev=document.getElementById('pdfPreview');
  prog.textContent='⏳ PDF açılıyor...';prev.innerHTML='';
  try{
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const out=[];
    for(let p=1;p<=pdf.numPages;p++){
      prog.textContent=`⏳ Sayfa ${p}/${pdf.numPages} okunuyor...`;
      const page=await pdf.getPage(p),vp=page.getViewport({scale:1});
      const rows=await pageRows(page,vp);
      const images=await pageImages(page,vp);
      let section='',unit='ad';const secs=[];
      rows.forEach(r=>{
        const line=r.tokens.join(' ');
        if(/FİYAT\s*TL\/?\s*m/i.test(line))unit='m';
        else if(/FİYAT\s*TL\/?\s*ad/i.test(line))unit='ad';
        if(isSection(line)){section=line.replace(/\|/g,'').trim();secs.push({name:section,y:r.y});}
        extractProducts(r.tokens).forEach(pr=>out.push({...pr,section,unit,page:p,y:r.y}));
      });
      // fotoğrafları en yakın bölüm başlığına eşle
      const secImg={};
      images.forEach(im=>{let best=null,bd=1e9;
        secs.forEach(s=>{const d=Math.abs(s.y-im.y);if(d<bd){bd=d;best=s.name;}});
        if(best&&bd<350&&!secImg[best])secImg[best]=im.dataUrl;});
      out.filter(o=>o.page===p).forEach(o=>{if(secImg[o.section]&&!o.image)o.image=secImg[o.section];});
    }
    // aynı kod varsa birleştir, JSON üret
    const map={};out.forEach(o=>{const k=o.code+o.name;if(!map[k])map[k]=o;});
    const final=Object.values(map).map(o=>({code:o.code,name:(o.section+' '+o.spec).replace(/\s+/g,' ').trim(),
      category:o.section.split(' ').slice(0,2).join(' ')||'Genel',unit:o.unit,
      buyPrice:o.price,vatRate:20,sellPrice:+(o.price*1.25*1.2).toFixed(2),qty:0,image:o.image||''}));
    document.getElementById('bulkTextarea').value=JSON.stringify(final,null,1);
    const withImg=final.filter(f=>f.image).length;
    prog.textContent=`✅ ${final.length} ürün bulundu • 🖼️ ${withImg} ürüne fotoğraf eşleşti`;
    prev.innerHTML=final.slice(0,60).map(f=>`<div class="pv">${f.image?`<img src="${f.image}">`:'<div style="height:80px;display:flex;align-items:center;justify-content:center;font-size:1.5rem">📦</div>'}<div>${f.name.slice(0,32)}</div><b>${fmt(f.buyPrice)}</b></div>`).join('');
  }catch(err){prog.textContent='❌ Hata: '+err.message;console.error(err);}
  e.target.value='';
});

const PRICE_RE=/^\d{1,3}(?:\.\d{3})*,\d{2}$/,QTY_RE=/^\d+(?:\/\d+)?$/,CODE_RE=/^\d{2,6}$/;
const HEAD_WORDS=/KOD|ÇAP|MİKTAR|FİYAT|PAKET|EBAT|SORUNUZ|mm|ad\./i;
function isSection(line){const t=line.replace(/\|/g,'').trim();
  return t.length>3&&t.length<60&&!PRICE_RE.test(t)&&!/\d{1,3}(?:\.\d{3})*,\d{2}/.test(t)
    &&t===t.toLocaleUpperCase('tr')&&!HEAD_WORDS.test(t)&&!/Listemizdeki|Diza/.test(t);}
async function pageRows(page,vp){
  const tc=await page.getTextContent(),map={};
  tc.items.forEach(it=>{const s=it.str.trim();if(!s)return;
    const k=Math.round((vp.height-it.transform[5])/4);
    (map[k]=map[k]||[]).push({x:it.transform[4],s});});
  return Object.keys(map).map(Number).sort((a,b)=>a-b).map(k=>{
    const row=map[k].sort((a,b)=>a.x-b.x);
    return {y:k*4,tokens:row.map(r=>r.s.replace(/[”“]/g,'"').replace(/\|/g,'')).filter(Boolean)};});
}
function extractProducts(tokens){
  const res=[];
  for(let i=0;i<tokens.length;i++){
    if(!PRICE_RE.test(tokens[i]))continue;
    if(HEAD_WORDS.test(tokens.slice(Math.max(0,i-4),i).join(' ')))continue;
    const price=parseFloat(tokens[i].replace(/\./g,'').replace(',','.'));
    // geriye doğru: adet, sonra kod bulunana kadar spec
    let j=i-1,qty=0;
    if(j>=0&&QTY_RE.test(tokens[j])&&!CODE_RE.test(tokens[j-1]||'')===false){/*noop*/}
    if(j>=0&&QTY_RE.test(tokens[j])){qty=parseInt(tokens[j]);j--;}
    let spec=[];let L=j;
    while(L>=0&&!PRICE_RE.test(tokens[L])&&!HEAD_WORDS.test(tokens[L])){spec.unshift(tokens[L]);L--;}
    if(spec.length<2)continue;
    const code=spec.shift();
    if(!CODE_RE.test(code))continue;
    const specStr=spec.join(' ');
    if(/^\d+(\.\d+)?$/.test(specStr)&&!specStr.includes('x')&&!specStr.includes('/')&&!specStr.includes('"'))continue; // yanlış eşleşme
    res.push({code,spec:specStr,price,qty});
    i=i; // döngü normal devam eder (birden fazla ürün/satır desteklenir)
  }
  return res;
}
async function pageImages(page,vp){
  const ops=await page.getOperatorList(),OPS=pdfjsLib.OPS,out=[];
  let ctm=[1,0,0,1,0,0];const st=[];
  for(let i=0;i<ops.fnArray.length;i++){
    const fn=ops.fnArray[i],a=ops.argsArray[i];
    try{
    if(fn===OPS.save)st.push([...ctm]);
    else if(fn===OPS.restore)ctm=st.pop()||ctm;
    else if(fn===OPS.transform)ctm=[a[0]*ctm[0]+a[1]*ctm[2],a[0]*ctm[1]+a[1]*ctm[3],a[2]*ctm[0]+a[3]*ctm[2],a[2]*ctm[1]+a[3]*ctm[3],a[4]*ctm[0]+a[5]*ctm[2]+ctm[4],a[4]*ctm[1]+a[5]*ctm[3]+ctm[5]];
    else if(fn===OPS.paintImageXObject||fn===OPS.paintInlineImageXObject){
      const img=fn===OPS.paintInlineImageXObject?a[0]:await new Promise(r=>page.objs.get(a[0],r));
      if(!img||!img.data||img.width<50||img.height<50)continue;
      const c=document.createElement('canvas'),sc=Math.min(200/img.width,200/img.height,1);
      c.width=Math.max(1,img.width*sc);c.height=Math.max(1,img.height*sc);
      const ctx=c.getContext('2d'),id=ctx.createImageData(c.width,c.height),bpp=img.data.length/(img.width*img.height);
      for(let y2=0;y2<c.height;y2++)for(let x2=0;x2<c.width;x2++){
        const si=Math.floor((Math.min(y2/sc,img.height-1))*img.width+Math.min(x2/sc,img.width-1))*bpp;
        const di=(y2*c.width+x2)*4;
        id.data[di]=img.data[si];id.data[di+1]=img.data[si+1];id.data[di+2]=img.data[si+2];id.data[di+3]=255;}
      ctx.putImageData(id,0,0);
      out.push({dataUrl:c.toDataURL('image/jpeg',.7),x:ctm[4],y:vp.height-ctm[5]});
    }}catch(e){}
  }
  return out;
}

/* ================= TOPLU İÇE AKTAR ================= */
function importBulk(){
  let arr;try{arr=JSON.parse(document.getElementById('bulkTextarea').value);}
  catch(e){return alert('JSON formatı hatalı!');}
  if(!Array.isArray(arr)||!arr.length)return alert('Liste boş!');
  let added=0,updated=0;
  arr.forEach(n=>{
    const ex=products.find(p=>p.code&&p.code===n.code);
    if(ex){ex.buyPrice=n.buyPrice;ex.sellPrice=n.sellPrice;if(n.image)ex.image=n.image;updated++;}
    else{products.push({id:Date.now()+added,code:n.code||'',name:n.name,category:n.category||'Genel',
      unit:n.unit||'ad',qty:+n.qty||0,buyPrice:+n.buyPrice||0,vatRate:n.vatRate??20,
      sellPrice:+n.sellPrice||+((+n.buyPrice||0)*1.2).toFixed(2),image:n.image||''});added++;}
  });
  save();renderStock();closeModal('mBulk');
  alert(`✅ İçe aktarıldı!\n🆕 Yeni: ${added} ürün\n🔄 Güncellenen: ${updated} ürün`);
}

/* ================= TESİSAT / BORÇ ================= */
function resetJobForm(){document.getElementById('jName').value='';document.getElementById('jPhone').value='';
  document.getElementById('jAddr').value='';document.getElementById('jDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('jLabor').value=0;document.getElementById('jPaid').value=0;
  document.getElementById('jobLines').innerHTML='';addJobLine();addJobLine();calcJob();}
function addJobLine(){
  const d=document.createElement('div');d.className='jobline';
  d.innerHTML=`<select style="flex:2" onchange="calcJob()"><option value="">Malzeme seç...</option>
    ${products.filter(p=>p.qty>0||!p.code).map((p,i)=>`<option value="${products.indexOf(p)}" data-price="${p.sellPrice}">${p.name} (${p.qty}${p.unit})</option>`).join('')}</select>
    <input style="flex:1" type="number" min="0" placeholder="Adet" value="1" oninput="calcJob()">
    <input style="flex:1" type="number" step="0.01" placeholder="B.Fiyat" oninput="calcJob()">
    <button class="btn red" style="padding:6px 10px" onclick="this.parentElement.remove();calcJob()">✕</button>`;
  d.querySelector('select').addEventListener('change',function(){
    const o=this.selectedOptions[0];if(o&&o.dataset.price)this.parentElement.children[2].value=o.dataset.price;calcJob();});
  document.getElementById('jobLines').appendChild(d);}
function calcJob(){
  let mat=0;
  document.querySelectorAll('#jobLines .jobline').forEach(l=>{
    const q=+l.children[1].value||0,pr=+l.children[2].value||0;mat+=q*pr;});
  const lab=+document.getElementById('jLabor').value||0,paid=+document.getElementById('jPaid').value||0;
  document.getElementById('jMat').textContent=fmt(mat);
  document.getElementById('jTotal').textContent=fmt(mat+lab);
  document.getElementById('jRemain').textContent=fmt(Math.max(0,mat+lab-paid));}
function saveJob(){
  const name=document.getElementById('jName').value.trim();if(!name)return alert('Müşteri adı gir!');
  const lines=[];
  document.querySelectorAll('#jobLines .jobline').forEach(l=>{
    const idx=+l.children[0].value,q=+l.children[1].value||0,pr=+l.children[2].value||0;
    if(idx>=0&&q>0)lines.push({pidx:idx,name:products[idx].name,qty:q,price:pr});});
  const lab=+document.getElementById('jLabor').value||0,paid=+document.getElementById('jPaid').value||0;
  const mat=lines.reduce((s,l)=>s+l.qty*l.price,0),total=mat+lab;
  const job={id:Date.now(),name,phone:document.getElementById('jPhone').value.trim(),
    date:document.getElementById('jDate').value,addr:document.getElementById('jAddr').value.trim(),
    lines,labor:lab,paid,matTotal:mat,total,remain:Math.max(0,total-paid)};
  lines.forEach(l=>{if(products[l.pidx])products[l.pidx].qty=Math.max(0,+(products[l.pidx].qty-l.qty).toFixed(2));});
  jobs.unshift(job);save();renderStock();renderJobs();closeModal('mJob');jobPDF(job);
  if(confirm('✅ Kaydedildi!\n\nPDF açıldı. WhatsApp ile de gönderilsin mi?'))jobWA(job);}
function renderJobs(){
  document.getElementById('jobList').innerHTML=jobs.map((j,i)=>`
    <div class="card"><div class="noimg">👷</div><div class="info">
      <h3>${j.name}</h3><span class="chip">${j.date}</span>
      ${j.remain>0?`<span class="chip" style="color:var(--red)">Borç: ${fmt(j.remain)}</span>`:`<span class="chip" style="color:var(--green)">Ödendi ✓</span>`}
      <div style="font-size:.78rem;color:var(--mut);margin-top:4px">Toplam: ${fmt(j.total)} • Ödenen: ${fmt(j.paid)}</div>
    </div><div>
      <button class="btn ghost" style="padding:5px 9px;font-size:.7rem;margin:2px" onclick="jobPDF(jobs[${i}])">📄 PDF</button>
      <button class="btn green" style="padding:5px 9px;font-size:.7rem;margin:2px" onclick="jobWA(jobs[${i}])">💬 WhatsApp</button>
      <button class="btn red" style="padding:5px 9px;font-size:.7rem;margin:2px" onclick="if(confirm('Silinsin mi?')){jobs.splice(${i},1);save();renderJobs();}">🗑</button>
    </div></div>`).join('')||'<p style="text-align:center;color:var(--mut);margin-top:30px">Henüz tesisat kaydı yok.</p>';}
const trFix=s=>(s||'').replace(/ç/g,'c').replace(/Ç/g,'C').replace(/ğ/g,'g').replace(/Ğ/g,'G')
  .replace(/ı/g,'i').replace(/İ/g,'I').replace(/ö/g,'o').replace(/Ö/g,'O').replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ü/g,'u').replace(/Ü/g,'U');
function jobPDF(j){
  const{jsPDF}=window.jspdf,doc=new jsPDF();
  doc.setFontSize(15);doc.text(trFix('TESİSAT / BORÇ BELGESİ'),14,18);
  doc.setFontSize(10);
  doc.text(`Müşteri: ${trFix(j.name)}   Tel: ${j.phone||'-'}`,14,30);
  doc.text(`Tarih: ${j.date}   Adres: ${trFix(j.addr)||'-'}`,14,37);
  let y=50;doc.setFont(undefined,'bold');doc.text('Malzeme',14,y);doc.text('Adet',120,y);doc.text('B.Fiyat',148,y);doc.text('Tutar',175,y);
  doc.setFont(undefined,'normal');y+=7;
  j.lines.forEach(l=>{if(y>270){doc.addPage();y=20;}
    doc.text(trFix(l.name).slice(0,45),14,y);doc.text(String(l.qty),120,y);
    doc.text(l.price.toFixed(2),148,y);doc.text((l.qty*l.price).toFixed(2),175,y);y+=7;});
  y+=4;
  doc.text(`İşçilik: ${j.labor.toFixed(2)} TL`,140,y);y+=7;
  doc.text(`TOPLAM: ${j.total.toFixed(2)} TL`,140,y);y+=7;
  doc.text(`Ödenen: ${j.paid.toFixed(2)} TL`,140,y);y+=7;
  doc.setFont(undefined,'bold');doc.text(`KALAN: ${j.remain.toFixed(2)} TL`,140,y);
  doc.save(`tesisat_${trFix(j.name).replace(/\s+/g,'_')}_${j.date}.pdf`);}
function jobWA(j){
  let t=`*TESİSAT BELGESİ*%0A👤 *${j.name}*%0A📅 ${j.date}%0A📍 ${j.addr||'-'}%0A%0A`;
  j.lines.forEach(l=>{t+=`• ${l.name} — ${l.qty} x ${l.price.toFixed(2)} ₺ = ${(l.qty*l.price).toFixed(2)} ₺%0A`;});
  t+=`%0A🔧 İşçilik: ${j.labor.toFixed(2)} ₺%0A💰 *TOPLAM: ${j.total.toFixed(2)} ₺*%0A✅ Ödenen: ${j.paid.toFixed(2)} ₺%0A⚠️ *KALAN: ${j.remain.toFixed(2)} ₺*`;
  const ph=j.phone?j.phone.replace(/\D/g,'').replace(/^0/,'90'):'';
  window.open(`https://wa.me/${ph}?text=${t}`,'_blank');}

/* ================= SESLİ DOLDURMA ================= */
function voiceFill(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert('Tarayıcın sesli girişi desteklemiyor (Chrome kullan).');
  const r=new SR();r.lang='tr-TR';
  document.getElementById('voiceMsg').textContent='🎙️ Dinleniyor... konuş (örn: "Ahmet Yılmaz 05321234567 3000 lira")';
  r.onresult=e=>{
    const t=e.results[0][0].transcript;
    document.getElementById('voiceMsg').textContent='👂 "'+t+'"';
    const ph=t.match(/0?\s?5[\d\s-]{9,12}/);
    if(ph)document.getElementById('jPhone').value=ph[0].replace(/\s|-/g,'');
    const rest=t.replace(ph?ph[0]:'','').replace(/\d+/g,'').replace(/\b(bin|lira|tl|yüz)\b/gi,'').trim();
    if(rest.length>2&&!document.getElementById('jName').value)document.getElementById('jName').value=rest.split(' ').slice(0,3).join(' ').replace(/^\w/,c=>c.toLocaleUpperCase('tr'));
    setTimeout(()=>document.getElementById('voiceMsg').textContent='',4000);};
  r.onerror=()=>document.getElementById('voiceMsg').textContent='❌ Mikrofon hatası';
  r.start();}

/* ================= BAŞLAT ================= */
renderStock();renderJobs();
</script>
