<style>
  :root{
    --bg:#EFF1ED;
    --surface:#FFFFFF;
    --ink:#1B2A2E;
    --ink-soft:#5C6B6E;
    --line:#DBDACF;
    --steel:#2C5F6B;
    --steel-dark:#1F454F;
    --steel-tint:#E4EDEE;
    --copper:#C1762C;
    --copper-dark:#9C5C1E;
    --copper-tint:#F7E9D8;
    --debt:#B0432E;
    --debt-tint:#F8E2DD;
    --paid:#3B7A57;
    --paid-tint:#E1EFE6;
  }
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.font-display{font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--copper-tint);}
  .surface{background:var(--surface); border:1px solid var(--line);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;border-radius:.6rem;padding:.7rem 1rem;font-size:.92rem;transition:transform .08s ease, background-color .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-steel{background:var(--steel);color:#fff;}
  .btn-steel:hover{background:var(--steel-dark);}
  .btn-copper{background:var(--copper);color:#fff;}
  .btn-copper:hover{background:var(--copper-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-danger{background:var(--debt-tint);color:var(--debt);}
  .btn-danger:hover{background:#f2cdc4;}
  .chip{display:inline-flex;align-items:center;border-radius:999px;padding:.2rem .65rem;font-size:.74rem;font-weight:600;}
  .field-label{font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:.25rem;display:block;}
  .field-input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.6rem .7rem;font-size:.95rem;color:var(--ink);}
  .field-input:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px var(--steel-tint);}
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tab-active{color:var(--steel);}
  .tab-inactive{color:#9AA3A1;}
  .modal-backdrop{background:rgba(27,42,46,.55);}
  .mic-btn{width:64px;height:64px;border-radius:999px;background:var(--copper);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(193,118,44,.4);}
  .mic-btn.listening{background:var(--debt);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,67,46,.5);}70%{box-shadow:0 0 0 16px rgba(176,67,46,0);}100%{box-shadow:0 0 0 0 rgba(176,67,46,0);}}
  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
  .table-row:not(:last-child){border-bottom:1px solid var(--line);}
  .low-stock{background:var(--debt-tint) !important;}
</style>
</head>
<body class="pb-24 min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-30 surface border-b" style="border-color:var(--line);">

<main class="max-w-2xl mx-auto px-4 pt-4">

  <!-- STOCK VIEW -->
  <section id="view-stock">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h2 class="text-base font-bold">Stok Takibi</h2>
        <p id="stock-value-summary" class="text-xs" style="color:var(--ink-soft);"></p>
      </div>
      <button onclick="openStockModal()" class="btn btn-steel">
        <svg class="icon" style="stroke:#fff;width:18px;height:18px;" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Malzeme Ekle
      </button>
    </div>
    <div class="relative mb-3">
      <svg class="icon absolute left-3 top-1/2 -translate-y-1/2" style="width:16px;height:16px;color:var(--ink-soft);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="stock-search" oninput="renderStock()" class="field-input pl-9" placeholder="Malzeme ara...">
    </div>
    <div id="stock-list" class="space-y-2"></div>
  </section>

  <!-- CUSTOMERS VIEW -->
  <section id="view-customers" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h2 class="text-base font-bold">Müşteri &amp; Borç Takibi</h2>
        <p id="debt-summary" class="text-xs" style="color:var(--ink-soft);"></p>
      </div>
      <button onclick="openCustomerModal()" class="btn btn-copper">
        <svg class="icon" style="stroke:#fff;width:18px;height:18px;" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Tesisat Ekle
      </button>
    </div>
    <div class="relative mb-3">
      <svg class="icon absolute left-3 top-1/2 -translate-y-1/2" style="width:16px;height:16px;color:var(--ink-soft);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="customer-search" oninput="renderCustomers()" class="field-input pl-9" placeholder="Müşteri ara...">
    </div>
    <div id="customer-list" class="space-y-2"></div>
  </section>

</main>

<!-- Bottom nav -->
<nav class="fixed bottom-0 left-0 right-0 z-30 surface border-t" style="border-color:var(--line);">
  <div class="max-w-2xl mx-auto grid grid-cols-2">
    <button onclick="switchTab('stock')" id="nav-stock" class="tab-active flex flex-col items-center gap-1 py-2.5">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      <span class="text-[11px] font-semibold">Stok</span>
    </button>
    <button onclick="switchTab('customers')" id="nav-customers" class="tab-inactive flex flex-col items-center gap-1 py-2.5">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.2 1.8-4 4-4"/></svg>
      <span class="text-[11px] font-semibold">Müşteri / Borç</span>
    </button>
  </div>
</nav>

<!-- STOCK MODAL -->
<div id="stock-modal" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 modal-backdrop" onclick="closeStockModal()"></div>
  <div class="absolute bottom-0 left-0 right-0 max-w-2xl mx-auto surface rounded-t-2xl p-5 max-h-[92vh] overflow-y-auto scrollbar-thin">
    <div class="flex items-center justify-between mb-4">
      <h3 id="stock-modal-title" class="text-base font-bold">Malzeme Ekle</h3>
      <button onclick="closeStockModal()" class="btn-ghost btn" style="padding:.4rem;"><svg class="icon" style="width:18px;height:18px;" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input type="hidden" id="stock-id">
    <div class="space-y-3">
      <div>
        <label class="field-label">Malzeme Adı</label>
        <input id="stock-name" class="field-input" placeholder="Örn: 20mm PPRC Boru">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Kategori</label>
          <input id="stock-category" class="field-input" placeholder="Boru / Vana / Dirsek...">
        </div>
        <div>
          <label class="field-label">Birim</label>
          <input id="stock-unit" class="field-input" placeholder="adet / metre / kg">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Adet</label>
          <input id="stock-qty" type="number" step="any" class="field-input" placeholder="0">
        </div>
        <div>
          <label class="field-label">KDV Oranı (%)</label>
          <input id="stock-vat" type="number" step="any" class="field-input" placeholder="20" value="20" oninput="updateStockSellPreview()">
        </div>
      </div>
      <div>
        <label class="field-label">Fiyat (KDV'siz)</label>

<script>
/* =========================================================
   FIREBASE INIT
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDFLH8ZtVQBgZbIv03SU8S_nrqAuvIRwEo",
  authDomain: "stok-cepte.firebaseapp.com",
  projectId: "stok-cepte",
  storageBucket: "stok-cepte.firebasestorage.app",
  messagingSenderId: "380358927982",
  appId: "1:380358927982:web:b917aac6317087ab06a87f",
  measurementId: "G-H1LN52FQ16"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================================================
   STORAGE MODULE — artık Firebase Firestore kullanıyor.
   Arayüz (getAll/saveAll/add/update/remove/getById) aynı
   kaldığı için sitenin geri kalan kodu HİÇ değişmedi.
   Firestore'a bağlanamazsa (offline, config hatası vb.)
   otomatik olarak localStorage'a düşer, veri kaybı olmaz.
   ========================================================= */
const STORAGE_PREFIX = 'stokcepte_';

const LocalFallback = {
  _key(collection){ return STORAGE_PREFIX + collection; },
  getAll(collection){
    try{ return JSON.parse(localStorage.getItem(this._key(collection)) || '[]'); }
    catch(e){ return []; }
  },
  saveAll(collection, data){
    localStorage.setItem(this._key(collection), JSON.stringify(data));
  }
};

const Store = {
  async getAll(collection){
    try{
      const snap = await db.collection(collection).get();
      const data = snap.docs.map(d => d.data());
      LocalFallback.saveAll(collection, data); // yerel yedek güncel tutulur
      return data;
    }catch(e){
      console.warn('Firestore okunamadı, localStorage kullanılıyor:', e);
      return LocalFallback.getAll(collection);
    }
  },
  async saveAll(collection, data){
    try{
      const batch = db.batch();
      data.forEach(item => batch.set(db.collection(collection).doc(item.id), item));
      await batch.commit();
    }catch(e){ console.warn('Firestore yazılamadı:', e); }
    LocalFallback.saveAll(collection, data);
    return data;
  },
  async add(collection, item){
    try{ await db.collection(collection).doc(item.id).set(item); }
    catch(e){ console.warn('Firestore ekleme hatası:', e); }
    const all = LocalFallback.getAll(collection);
    all.unshift(item);
    LocalFallback.saveAll(collection, all);
    return item;
  },
  async update(collection, id, patch){
    try{ await db.collection(collection).doc(id).set(patch, { merge: true }); }
    catch(e){ console.warn('Firestore güncelleme hatası:', e); }
    const all = LocalFallback.getAll(collection);
    const idx = all.findIndex(x => x.id === id);
    if(idx > -1){ all[idx] = {...all[idx], ...patch}; LocalFallback.saveAll(collection, all); return all[idx]; }
    return patch;
  },
  async remove(collection, id){
    try{ await db.collection(collection).doc(id).delete(); }
    catch(e){ console.warn('Firestore silme hatası:', e); }
    let all = LocalFallback.getAll(collection);
    all = all.filter(x => x.id !== id);
    LocalFallback.saveAll(collection, all);
  },
  async getById(collection, id){
    try{
      const docSnap = await db.collection(collection).doc(id).get();
      if(docSnap.exists) return docSnap.data();
    }catch(e){ console.warn('Firestore getById hatası:', e); }
    const all = LocalFallback.getAll(collection);
    return all.find(x => x.id === id) || null;
  }
};

const COLL_STOCK = 'stock';
const COLL_CUSTOMERS = 'customers';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺'; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.add('hidden'), 2600);
}

/* =========================================================
   TAB SWITCHING
   ========================================================= */
function switchTab(tab){
  document.getElementById('view-stock').classList.toggle('hidden', tab !== 'stock');
  document.getElementById('view-customers').classList.toggle('hidden', tab !== 'customers');
  document.getElementById('nav-stock').className = (tab==='stock' ? 'tab-active' : 'tab-inactive') + ' flex flex-col items-center gap-1 py-2.5';
  document.getElementById('nav-customers').className = (tab==='customers' ? 'tab-active' : 'tab-inactive') + ' flex flex-col items-center gap-1 py-2.5';
  if(tab === 'stock') renderStock(); else renderCustomers();
}

/* =========================================================
   STOCK — CRUD + RENDER
   ========================================================= */
const DEFAULT_STOCK_ICON_SVG = `<svg class="icon" style="width:24px;height:24px;color:var(--steel);" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>`;

function setStockImagePreview(dataUrl){
  const preview = document.getElementById('stock-image-preview');
  if(dataUrl){
    preview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
  } else {
    preview.innerHTML = DEFAULT_STOCK_ICON_SVG;
  }
}

function handleStockImageChange(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Lütfen bir görsel dosyası seçin'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('stock-image-data').value = reader.result;
    setStockImagePreview(reader.result);
  };
  reader.readAsDataURL(file);
}

function clearStockImage(){
  document.getElementById('stock-image-data').value = '';
  document.getElementById('stock-image-input').value = '';
  setStockImagePreview(null);
}

function updateStockSellPreview(){
  const base = parseFloat(document.getElementById('stock-buy').value) || 0;
  const vat = parseFloat(document.getElementById('stock-vat').value) || 0;
  const sell = base * (1 + vat / 100);
  document.getElementById('stock-sell').value = sell;
  document.getElementById('stock-sell-display').textContent = fmtMoney(sell);
}

function openStockModal(item){
  document.getElementById('stock-modal-title').textContent = item ? 'Malzemeyi Düzenle' : 'Malzeme Ekle';
  document.getElementById('stock-id').value = item ? item.id : '';
  document.getElementById('stock-name').value = item ? item.name : '';
  document.getElementById('stock-category').value = item ? item.category : '';
  document.getElementById('stock-unit').value = item ? item.unit : 'adet';
  document.getElementById('stock-qty').value = item ? item.qty : '';
  document.getElementById('stock-buy').value = item ? item.buyPrice : '';
  document.getElementById('stock-vat').value = item ? (item.vatRate ?? 20) : 20;
  updateStockSellPreview();
  document.getElementById('stock-image-input').value = '';
  document.getElementById('stock-image-data').value = item && item.image ? item.image : '';
  setStockImagePreview(item && item.image ? item.image : null);
  document.getElementById('stock-modal').classList.remove('hidden');
}
function closeStockModal(){ document.getElementById('stock-modal').classList.add('hidden'); }

let isSavingStock = false;
async function saveStockItem(){
  if(isSavingStock) return; // art arda basmayı engeller
  const name = document.getElementById('stock-name').value.trim();
  if(!name){ showToast('Malzeme adı gerekli'); return; }
  isSavingStock = true;
  const btn = document.getElementById('save-stock-btn');
  const btnPrevText = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.classList.add('opacity-60','pointer-events-none'); btn.textContent = 'Kaydediliyor...'; }
  try{
    const id = document.getElementById('stock-id').value;
    const payload = {
      name,
      category: document.getElementById('stock-category').value.trim() || 'Genel',
      unit: document.getElementById('stock-unit').value.trim() || 'adet',
      qty: parseFloat(document.getElementById('stock-qty').value) || 0,
      buyPrice: parseFloat(document.getElementById('stock-buy').value) || 0,
      sellPrice: parseFloat(document.getElementById('stock-sell').value) || 0,
      vatRate: parseFloat(document.getElementById('stock-vat').value) || 0,
      image: document.getElementById('stock-image-data').value || null,
    };
    if(id){ await Store.update(COLL_STOCK, id, payload); showToast('Malzeme güncellendi'); }
    else{ await Store.add(COLL_STOCK, {id: uid(), ...payload}); showToast('Malzeme eklendi'); }
    closeStockModal();
    renderStock();
  } finally {
    isSavingStock = false;
    if(btn){ btn.disabled = false; btn.classList.remove('opacity-60','pointer-events-none'); btn.textContent = btnPrevText; }
  }
}

async function deleteStockItem(id){
  if(!confirm('Bu malzemeyi silmek istediğinize emin misiniz?')) return;
  await Store.remove(COLL_STOCK, id);
  showToast('Malzeme silindi');
  renderStock();
}

async function renderStock(){
  const search = (document.getElementById('stock-search').value || '').toLowerCase();
  const all = await Store.getAll(COLL_STOCK);
  const list = all.filter(i => !search || i.name.toLowerCase().includes(search) || (i.category||'').toLowerCase().includes(search));
  const container = document.getElementById('stock-list');

  const totalValue = all.reduce((s,i)=> s + (i.qty * i.buyPrice), 0);
  document.getElementById('stock-value-summary').textContent = `${all.length} kalem · Toplam maliyet ${fmtMoney(totalValue)}`;
  document.getElementById('header-summary').innerHTML = '';

  if(list.length === 0){
    container.innerHTML = `<div class="surface rounded-xl p-6 text-center text-sm" style="color:var(--ink-soft);">
      Henüz malzeme yok. "Malzeme Ekle" ile stok listeni oluşturmaya başla.
    </div>`;
    return;
  }

  container.innerHTML = list.map(i => `
    <div class="surface rounded-xl p-3.5 flex items-center gap-3 ${i.qty <= 5 ? 'low-stock' : ''}">
      <div class="w-1.5 self-stretch rounded-full" style="background:var(--steel);"></div>
      <div class="w-11 h-11 rounded-lg overflow-hidden flex items-center justify-center shrink-0" style="background:var(--steel-tint);border:1px solid var(--line);">
        ${i.image ? `<img src="${i.image}" class="w-full h-full object-cover">` : `<svg class="icon" style="width:20px;height:20px;color:var(--steel);" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>`}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <p class="font-semibold text-sm truncate">${escapeHtml(i.name)}</p>
          <span class="chip" style="background:var(--steel-tint);color:var(--steel-dark);">${escapeHtml(i.category)}</span>
        </div>
        <p class="text-xs mt-1" style="color:var(--ink-soft);">
          ${i.qty} ${escapeHtml(i.unit)} stokta · KDV'siz ${fmtMoney(i.buyPrice)} · Satış (KDV Dahil) ${fmtMoney(i.sellPrice)}${i.vatRate ? ` · KDV %${i.vatRate}` : ''}
        </p>
      </div>
      <div class="flex flex-col gap-1.5">
        <button onclick='openStockModal(${JSON.stringify(i).replace(/'/g, "&apos;")})' class="btn-ghost btn" style="padding:.35rem;">
          <svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>
        </button>
        <button onclick="deleteStockItem('${i.id}')" class="btn-danger btn" style="padding:.35rem;">
          <svg class="icon" style="width:16px;height:16px;color:var(--debt);" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

   CUSTOMER / DEBT MODAL
   ========================================================= */
let materialRowCount = 0;
let currentStockCache = [];

async function openCustomerModal(customer){
  document.getElementById('customer-modal-title').textContent = customer ? 'Tesisat / Borç Kaydını Düzenle' : 'Tesisat / Borç Ekle';
  document.getElementById('customer-id').value = customer ? customer.id : '';
  document.getElementById('customer-name').value = customer ? customer.name : '';
  document.getElementById('customer-phone').value = customer ? customer.phone : '';
  document.getElementById('customer-address').value = customer ? customer.address : '';
  document.getElementById('customer-date').value = customer ? customer.date : todayStr();
  document.getElementById('customer-paid').value = customer ? customer.paid : 0;
  document.getElementById('customer-labor').value = customer ? (customer.laborCost || 0) : 0;
  document.getElementById('voice-status').textContent = '';
  document.getElementById('voice-transcript-box').classList.add('hidden');

  currentStockCache = await Store.getAll(COLL_STOCK);
  document.getElementById('material-rows').innerHTML = '';
  materialRowCount = 0;

  if(customer && customer.items && customer.items.length){
    customer.items.forEach(it => addMaterialRow(it));
  } else {
    addMaterialRow();
  }
  updateTotals();
  document.getElementById('customer-modal').classList.remove('hidden');
}

function closeCustomerModal(){
  document.getElementById('customer-modal').classList.add('hidden');
  stopVoice();
}

function stockOptionsHtml(selectedName){
  let opts = `<option value="__custom__">Elle gir...</option>`;
  currentStockCache.forEach(s => {
    const sel = s.name === selectedName ? 'selected' : '';
    opts += `<option value="${escapeHtml(s.name)}" data-price="${s.sellPrice}" data-unit="${escapeHtml(s.unit)}" ${sel}>${escapeHtml(s.name)} (${s.qty} ${escapeHtml(s.unit)} mevcut)</option>`;
  });
  return opts;
}

function addMaterialRow(prefill){
  materialRowCount++;
  const rowId = 'mrow-' + materialRowCount;
  const wrap = document.createElement('div');
  wrap.className = 'rounded-lg p-2 space-y-1.5';
  wrap.style.cssText = 'background:var(--surface);border:1px solid var(--line);';
  wrap.id = rowId;

  const matched = prefill ? currentStockCache.find(s => s.name.toLowerCase() === (prefill.name||'').toLowerCase()) : null;
  const isCustom = !!(prefill && !matched);

  wrap.innerHTML = `
    <div class="flex items-center gap-1.5">
      <select class="flex-1 field-input text-xs" style="padding:.5rem;" onchange="onMaterialSelectChange('${rowId}')">
        ${stockOptionsHtml(matched ? matched.name : null)}
      </select>
      <button onclick="document.getElementById('${rowId}').remove(); updateTotals();" class="btn-ghost btn shrink-0" style="padding:.4rem;">
        <svg class="icon" style="width:15px;height:15px;color:var(--debt);" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
    <div class="grid grid-cols-12 gap-1.5">
      <div class="col-span-6">
        <span class="block text-[10px] font-semibold mb-0.5" style="color:var(--ink-soft);">Malzeme Adı</span>
        <input type="text" placeholder="Malzeme adını yazın" class="w-full field-input text-xs custom-name-input" style="padding:.5rem;" value="${prefill ? escapeHtml(prefill.name) : ''}" ${isCustom ? '' : 'disabled'} oninput="updateTotals()">
      </div>
      <div class="col-span-3">
        <span class="block text-[10px] font-semibold mb-0.5 qty-label" style="color:var(--ink-soft);">Miktar / Adet</span>
        <input type="number" step="any" placeholder="0" class="w-full field-input text-xs qty-input" style="padding:.5rem;" value="${prefill ? prefill.qty : 1}" oninput="updateTotals()">
      </div>
      <div class="col-span-3">
        <span class="block text-[10px] font-semibold mb-0.5" style="color:var(--ink-soft);">Birim Fiyat (₺)</span>
        <input type="number" step="any" placeholder="0" class="w-full field-input text-xs price-input" style="padding:.5rem;" value="${prefill ? prefill.price : (matched ? matched.sellPrice : 0)}" oninput="updateTotals()">
      </div>
    </div>
  `;
  document.getElementById('material-rows').appendChild(wrap);

  const sel = wrap.querySelector('select');
  const customInput = wrap.querySelector('.custom-name-input');
  if(isCustom){
    sel.value = '__custom__';
  } else if(matched){
    customInput.value = matched.name;
    customInput.disabled = true;
  } else if(!prefill){
    // brand new empty row defaults to manual entry so the user can type right away
    sel.value = '__custom__';
    customInput.disabled = false;
  }
  updateQtyLabel(rowId, matched ? matched.unit : (prefill && !isCustom ? prefill.unit : null));
  updateTotals();
}

function updateQtyLabel(rowId, unit){
  const row = document.getElementById(rowId);
  if(!row) return;
  const label = row.querySelector('.qty-label');
  if(!label) return;
  label.textContent = unit ? `Miktar (${unit})` : 'Miktar / Adet';
}

function onMaterialSelectChange(rowId){
  const row = document.getElementById(rowId);
  const sel = row.querySelector('select');
  const customInput = row.querySelector('.custom-name-input');
  const priceInput = row.querySelector('.price-input');
  if(sel.value === '__custom__'){
    customInput.disabled = false;
    customInput.value = '';
    customInput.focus();
    updateQtyLabel(rowId, null);
  } else {
    const opt = sel.options[sel.selectedIndex];
    customInput.disabled = true;
    customInput.value = sel.value; // shows the picked product name, greyed out
    priceInput.value = opt.dataset.price || 0;
    updateQtyLabel(rowId, opt.dataset.unit || null);
  }
  updateTotals();
}

function collectMaterialRows(){
  const rows = [...document.getElementById('material-rows').children];
  return rows.map(row => {
    const sel = row.querySelector('select');
    const customInput = row.querySelector('.custom-name-input');
    const name = sel.value === '__custom__' ? customInput.value.trim() : sel.value;
    const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
    const price = parseFloat(row.querySelector('.price-input').value) || 0;
    const stockMatch = currentStockCache.find(s => s.name === name);
    return { name, qty, price, unit: stockMatch ? stockMatch.unit : 'adet', stockId: stockMatch ? stockMatch.id : null };
  }).filter(r => r.name);
}

function updateTotals(){
  const items = collectMaterialRows();
  const materialsTotal = items.reduce((s,i)=> s + i.qty * i.price, 0);
  const labor = parseFloat(document.getElementById('customer-labor').value) || 0;
  const total = materialsTotal + labor;
  const paid = parseFloat(document.getElementById('customer-paid').value) || 0;
  const remaining = total - paid;
  document.getElementById('customer-total-display').textContent = fmtMoney(total);
  document.getElementById('customer-remaining-display').textContent = fmtMoney(remaining);
  return { total, paid, remaining, items, labor };
}

let isSavingCustomer = false;
async function saveCustomer(){
  if(isSavingCustomer) return; // art arda basmayı engeller
  const name = document.getElementById('customer-name').value.trim();
  if(!name){ showToast('Müşteri adı gerekli'); return; }
  const { total, paid, remaining, items, labor } = updateTotals();
  if(items.length === 0){ showToast('En az bir malzeme satırı ekleyin'); return; }

  isSavingCustomer = true;
  const btn = document.getElementById('save-customer-btn');
  const btnPrevText = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.classList.add('opacity-60','pointer-events-none'); btn.textContent = 'Kaydediliyor...'; }
  try{
    const id = document.getElementById('customer-id').value || uid();
    const customer = {
      id,
      name,
      phone: document.getElementById('customer-phone').value.trim(),
      address: document.getElementById('customer-address').value.trim(),
      date: document.getElementById('customer-date').value || todayStr(),
      items,
      laborCost: labor,
      total, paid, remaining,
      pdfData: null,
      pdfFileName: null,
    };

    // Decrement matched stock quantities
    for(const it of items){
      if(it.stockId){
        const stockItem = currentStockCache.find(s => s.id === it.stockId);
        if(stockItem){
          await Store.update(COLL_STOCK, it.stockId, { qty: Math.max(0, stockItem.qty - it.qty) });
        }
      }
    }

    // Generate PDF
    const { dataUri, fileName } = generateInvoicePdf(customer);
    customer.pdfData = dataUri;
    customer.pdfFileName = fileName;

    const exists = await Store.getById(COLL_CUSTOMERS, id);
    if(exists){ await Store.update(COLL_CUSTOMERS, id, customer); }
    else{ await Store.add(COLL_CUSTOMERS, customer); }

    showToast('Kayıt ve PDF oluşturuldu');
    closeCustomerModal();
    renderCustomers();
    renderStock();
  } finally {
    isSavingCustomer = false;
    if(btn){ btn.disabled = false; btn.classList.remove('opacity-60','pointer-events-none'); btn.textContent = btnPrevText; }
  }
}

async function deleteCustomer(id){
  if(!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
  await Store.remove(COLL_CUSTOMERS, id);
  showToast('Kayıt silindi');
  renderCustomers();
}

async function editCustomer(id){
  const c = await Store.getById(COLL_CUSTOMERS, id);
  if(c) openCustomerModal(c);
}

function normalizePhoneForWhatsapp(phone){
  let digits = (phone || '').replace(/\D/g, '');
  if(!digits) return '';
  if(digits.startsWith('90') && digits.length >= 12) return digits;
  if(digits.startsWith('0')) digits = digits.slice(1);
  return '90' + digits;
}

function buildWhatsAppMessage({name, address, total, paid, remaining}){
  return `Sayın ${name || 'Müşterimiz'}, Tesisat ve malzeme döküm detayınız aşağıdadır:\n\n` +
    `• Adres / Bina: ${address || '-'}\n` +
    `• Toplam Tutar: ${Number(total || 0).toFixed(2)} TL\n` +
    `• Ödenen Tutar: ${Number(paid || 0).toFixed(2)} TL\n` +
    `• Kalan Borç: ${Number(remaining || 0).toFixed(2)} TL\n\n` +
    `Detaylı tesisat ve malzeme döküm PDF'iniz hazırlanmıştır, ekte bilgilerinize sunulmuştur.`;
}

function openWhatsAppChat(phone, message){
  const normalized = normalizePhoneForWhatsapp(phone);
  if(!normalized || normalized.length < 12){
    showToast('Geçerli bir telefon numarası girilmemiş');
    return;
  }
  const url = `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

async function sendWhatsApp(id){
  const c = await Store.getById(COLL_CUSTOMERS, id);
  if(!c) return;
  const message = buildWhatsAppMessage(c);
  openWhatsAppChat(c.phone, message);
}

/* =========================================================
   PDF DOWNLOAD — mobile-safe.
   Raw <a href="data:..." download> is unreliable on mobile
   (iOS Safari mostly ignores "download" for data: URIs and
   just tries to preview/navigate instead, often showing
   nothing). We convert the stored base64 data URI to a real
   Blob + object URL, which works on Android/desktop, and on
   iOS we open it in a new tab so the user can use the native
   Share icon to save the PDF.
   ========================================================= */
function dataUriToBlob(dataUri){
  const [header, base64] = dataUri.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS 13+
}

async function downloadCustomerPdf(id){
  const c = await Store.getById(COLL_CUSTOMERS, id);
  if(!c || !c.pdfData){ showToast('PDF bulunamadı'); return; }
  try{
    const blob = dataUriToBlob(c.pdfData);
    const blobUrl = URL.createObjectURL(blob);
    const fileName = c.pdfFileName || 'dokum.pdf';

    if(isIOS()){
      // Download attribute is unreliable for PDFs on iOS Safari;
      // open in a new tab so the user can tap Share > Save to Files.
      window.open(blobUrl, '_blank');
      showToast('PDF açıldı — kaydetmek için paylaş simgesine dokunun');
    } else {
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
  }catch(e){
    console.warn('PDF indirme hatası:', e);
    showToast('PDF indirilemedi, tekrar deneyin');
  }
}

/* =========================================================
   PDF GENERATION (jsPDF)
   jsPDF's built-in "helvetica" font only supports WinAnsi
   encoding, which does not include the Turkish-specific
   characters ş/Ş, ğ/Ğ, ı/İ (ç/ö/ü render fine but are
   included below for full safety). We transliterate all
   text going into the PDF to their closest ASCII equivalent
   so nothing renders as garbled boxes/underscores.
   ========================================================= */
const TR_ASCII_MAP = {
  'ş':'s', 'Ş':'S', 'ğ':'g', 'Ğ':'G', 'ı':'i', 'İ':'I',
  'ç':'c', 'Ç':'C', 'ö':'o', 'Ö':'O', 'ü':'u', 'Ü':'U'
};
function trToAscii(str){
  return (str === null || str === undefined ? '' : String(str))
    .replace(/[şŞğĞıİçÇöÖüÜ]/g, ch => TR_ASCII_MAP[ch] || ch)
    .replace(/[—–]/g, '-'); // em/en dash also unsupported by the base font
}

function generateInvoicePdf(customer){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const marginX = 15;
  let y = 20;
  const pdfText = (str, x, yy) => doc.text(trToAscii(str), x, yy);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(28, 43, 46);
  pdfText('Stok Cepte - Tesisat Malzeme ve Borc Dokumu', marginX, y);
  y += 8;
  doc.setDrawColor(219, 218, 207);
  doc.line(marginX, y, 195, y);
  y += 8;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10.5);
  doc.setTextColor(60, 60, 60);
  pdfText(`Musteri: ${customer.name}`, marginX, y); y += 6;
  pdfText(`Telefon: ${customer.phone || '-'}`, marginX, y); y += 6;
  pdfText(`Adres / Bina: ${customer.address || '-'}`, marginX, y); y += 6;
  pdfText(`Tarih: ${customer.date}`, marginX, y); y += 10;

  // Table header
  doc.setFillColor(228, 237, 238);
  doc.rect(marginX, y, 180, 8, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(31, 69, 79);
  pdfText('Malzeme', marginX + 2, y + 5.5);
  pdfText('Adet', marginX + 95, y + 5.5);
  pdfText('Birim Fiyat', marginX + 120, y + 5.5);
  pdfText('Tutar', marginX + 160, y + 5.5);
  y += 8;

  doc.setFont('helvetica', 'normal');
  doc.setTextColor(40, 40, 40);
  customer.items.forEach((it, idx) => {
    if(idx % 2 === 1){ doc.setFillColor(245, 245, 242); doc.rect(marginX, y, 180, 7, 'F'); }
    const lineTotal = it.qty * it.price;
    pdfText(`${it.name}`, marginX + 2, y + 5);
    pdfText(`${it.qty} ${it.unit}`, marginX + 95, y + 5);
    pdfText(`${it.price.toFixed(2)} TL`, marginX + 120, y + 5);
    pdfText(`${lineTotal.toFixed(2)} TL`, marginX + 160, y + 5);
    y += 7;
    if(y > 265){ doc.addPage(); y = 20; }
  });

  y += 4;
  doc.setDrawColor(219, 218, 207);
  doc.line(marginX, y, 195, y);
  y += 8;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10.5);
  doc.setTextColor(60, 60, 60);
  if(customer.laborCost){
    pdfText(`Iscilik: ${Number(customer.laborCost).toFixed(2)} TL`, marginX, y); y += 6;
  }

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(40, 40, 40);
  pdfText(`Toplam Tutar: ${customer.total.toFixed(2)} TL`, marginX, y); y += 6;
  pdfText(`Odenen: ${customer.paid.toFixed(2)} TL`, marginX, y); y += 6;
  doc.setTextColor(176, 67, 46);
  pdfText(`Kalan Borc: ${customer.remaining.toFixed(2)} TL`, marginX, y);

  const dataUri = doc.output('datauristring');
  const safeName = trToAscii(customer.name).replace(/[^a-zA-Z0-9]+/g, '_');
  const fileName = `dokum_${safeName}_${customer.date}.pdf`;
  return { dataUri, fileName };
}

/* =========================================================
   VOICE INPUT (Web Speech API) + Turkish heuristic parser
   ========================================================= */
let recognition = null;
let isListening = false;

function getRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'tr-TR';
  r.continuous = false;
  r.interimResults = false;
  return r;
}

function toggleVoice(){
  if(isListening){ stopVoice(); return; }
  recognition = getRecognition();
  if(!recognition){
    showToast('Tarayıcınız sesle girişi desteklemiyor');
    return;
  }
  isListening = true;
  document.getElementById('mic-button').classList.add('listening');
  document.getElementById('voice-status').textContent = 'Dinleniyor... konuşabilirsiniz';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('voice-transcript-box').classList.remove('hidden');
    document.getElementById('voice-transcript-box').textContent = '"' + transcript + '"';
    applyVoiceTranscript(transcript);
  };
  recognition.onerror = () => {
    document.getElementById('voice-status').textContent = 'Ses algılanamadı, tekrar deneyin';
    stopVoice();
  };
  recognition.onend = () => stopVoice();

  recognition.start();
}

function stopVoice(){
  isListening = false;
  document.getElementById('mic-button').classList.remove('listening');
  if(recognition){ try{ recognition.stop(); }catch(e){} }
}

const UNIT_WORDS = ['metre','mt','adet','ad','kg','gram','gr','litre','lt','paket','kutu','rulo','torba','m'];

function parseVoiceTranscript(transcript){
  const result = { name: '', address: '', phone: '', materials: [] };
  let segments = transcript.split(',').map(s => s.trim()).filter(Boolean);

  if(segments.length <= 1){
    // Fallback: no commas spoken, try to split on natural boundaries
    segments = transcript.split(/\s+ve\s+|\.\s+/i).map(s => s.trim()).filter(Boolean);
  }

  const materialRegex = new RegExp(`^(\\d+)\\s*(${UNIT_WORDS.join('|')})?\\.?\\s+(.+)$`, 'i');
  const phoneRegex = /(\d[\d\s]{8,14}\d)/;

  segments.forEach(seg => {
    const lower = seg.toLowerCase();

    if(lower.startsWith('telefon') || phoneRegex.test(seg)){
      const m = seg.match(phoneRegex);
      if(m){ result.phone = m[1].replace(/\s+/g, ''); return; }
    }

    const matMatch = seg.match(materialRegex);
    if(matMatch){
      result.materials.push({
        qty: parseInt(matMatch[1], 10),
        unit: matMatch[2] ? matMatch[2].toLowerCase() : 'adet',
        name: matMatch[3].trim()
      });
      return;
    }

    if(!result.name){ result.name = seg; }
    else if(!result.address){ result.address = seg; }
    else{ result.address += ', ' + seg; }
  });

  return result;
}

function applyVoiceTranscript(transcript){
  const parsed = parseVoiceTranscript(transcript);
  if(parsed.name) document.getElementById('customer-name').value = parsed.name;
  if(parsed.address) document.getElementById('customer-address').value = parsed.address;
  if(parsed.phone) document.getElementById('customer-phone').value = parsed.phone;

  if(parsed.materials.length){
    document.getElementById('material-rows').innerHTML = '';
    materialRowCount = 0;
    parsed.materials.forEach(m => {
      const stockMatch = currentStockCache.find(s => s.name.toLowerCase().includes(m.name.toLowerCase()) || m.name.toLowerCase().includes(s.name.toLowerCase()));
      addMaterialRow({
        name: stockMatch ? stockMatch.name : m.name,
        qty: m.qty,
        price: stockMatch ? stockMatch.sellPrice : 0
      });
    });
  }
  document.getElementById('voice-status').textContent = 'Alanlar dolduruldu, kontrol edip kaydedin';
  updateTotals();
}

  await renderStock();
  await renderCustomers();
